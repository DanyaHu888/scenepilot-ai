kind = "web"
previewPath = "/"
title = "ScenePilot"
description = "A cinematic production planning assistant that turns scene descriptions and production constraints into practical shooting plans for filmmakers."
version = "1.0.0"
id = "artifacts/scenepilot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20941

[services.development]
run = "pnpm --filter @workspace/scenepilot run dev"

[services.production.build]
args = [ "true" ]

[services.production.run]
args = [ "python3", "artifacts/scenepilot/app.py" ]

[services.production.run.env]
PORT = "20941"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "20941"
BASE_PATH = "/"
